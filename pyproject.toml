[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyelectrochemreader"
version = "0.1.0"
description = "Simple electrochemical file readers in Python and NumPy"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=1.23"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Source = "https://github.com/kevinsmia1939/PyElectrochemReader"
Issues = "https://github.com/kevinsmia1939/PyElectrochemReader/issues"
Documentation = "https://github.com/kevinsmia1939/PyElectrochemReader#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyelectrochemreader = ["py.typed", "licenses/*"]
